[package]
name = "francor-maqueen-plus-microbit"
version = "0.1.0"
description = "BBC micro:bit V2 (nRF52833) glue for the francor-maqueen-plus driver, built on embassy-nrf"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
francor-maqueen-plus = { workspace = true, features = ["defmt"] }
embassy-nrf = { workspace = true }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-embedded-hal = { workspace = true }
static_cell = { workspace = true }
cortex-m = { workspace = true }
defmt = { workspace = true }

# ARM-only glue crate: no libtest for thumbv7em-none-eabihf, and nothing here is
# host-testable. Host unit tests live in francor-maqueen-plus.
[lib]
test = false
doctest = false
bench = false

[workspace]
resolver = "2"
members = [".", "examples"]
default-members = ["."]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/franc0r/francor-maqueen-plus-microbit"

[workspace.dependencies]
francor-maqueen-plus = { git = "https://github.com/franc0r/francor-maqueen-plus" }
francor-maqueen-plus-microbit = { path = "." }
embassy-nrf = { version = "0.11.0", default-features = false, features = ["nrf52833", "rt", "time-driver-rtc1", "time", "gpiote", "defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"] }
embassy-futures = "0.1.2"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"

[profile.release]
debug = 2
lto = "fat"
opt-level = "s"

[profile.dev]
opt-level = 1
